<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restock</title>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="description" content="A Respiratory Films production.">
<meta property="og:title" content="Restock">
<meta property="og:description" content="A Respiratory Films production.">
<meta property="og:image" content="og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="og.jpg">
<meta property="og:type" content="video.other">
<style>
  :root{
    --bg:#000; --fg:#f2f2f2; --dim:#8b8b8b; --rule:#242424; --accent:#7fd3e6;
  }
  :root:not([data-theme="light"]){ color-scheme: dark; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font:400 16px/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:0 16px 64px;
  }
  header{width:100%;max-width:1200px;padding:44px 0 26px;text-align:center}
  h1{
    margin:0; font-size:clamp(32px,7vw,60px); font-weight:700;
    letter-spacing:.34em; text-indent:.34em; text-transform:uppercase;
  }
  .sub{
    margin:12px 0 0; color:var(--dim);
    font-size:clamp(10px,2.2vw,12px); letter-spacing:.24em; text-transform:uppercase;
  }
  .frame{width:100%;max-width:1200px}
  video{
    width:100%; height:auto; display:block; background:#000;
    border:1px solid var(--rule); border-radius:3px;
  }
  .meta{
    width:100%;max-width:1200px; margin-top:22px;
    display:flex; flex-wrap:wrap; gap:10px 34px; justify-content:center;
    color:var(--dim); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  }
  .meta b{color:var(--fg);font-weight:600}
  .actions{margin-top:30px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  a.btn{
    color:var(--fg); text-decoration:none; border:1px solid var(--rule);
    padding:11px 22px; border-radius:3px; font-size:12px;
    letter-spacing:.18em; text-transform:uppercase; transition:border-color .15s,color .15s;
  }
  a.btn:hover{border-color:var(--accent);color:var(--accent)}
  footer{margin-top:44px;color:#5c5c5c;font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-align:center}
</style>
</head>
<body>
  <header>
    <h1>Restock</h1>
    <p class="sub">A Respiratory Films Production</p>
  </header>

  <div class="frame">
    <video controls playsinline preload="metadata" poster="poster.jpg">
      <source src="Restock.mp4" type="video/mp4">
      Your browser doesn't support embedded video.
      <a href="Restock.mp4">Download the file instead.</a>
    </video>
  </div>

  <div class="meta">
    <span><b>1:05</b> runtime</span>
    <span><b>2.39:1</b> scope</span>
    <span><b>Rated R</b> for respiratory</span>
  </div>

  <div class="actions">
    <a class="btn" href="Restock.mp4" download>Download</a>
  </div>

  <footer>No cart left behind</footer>
</body>
</html>
